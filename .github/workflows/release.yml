name: release

on:
  schedule:
    # Weekly, Monday 08:00 UTC. Skipped automatically when there are no new commits.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: <year>.<month>.<build-count-this-month>)'
        required: false
        type: string

permissions:
  contents: write # push tag + create release
  actions: write # dispatch build.yml on the new tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          else
            YEAR=$(date -u +%Y)
            MONTH=$(date -u +%-m)
            BUILD=$(git tag --list "v${YEAR}.${MONTH}.*" | wc -l | tr -d ' ')
            VERSION="${YEAR}.${MONTH}.${BUILD}"
          fi

          # Weekly runs with nothing new since the last release are a no-op.
          SKIP=false
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] && [ -n "$LAST_TAG" ] \
              && [ "$(git rev-list "$LAST_TAG"..HEAD --count)" = '0' ]; then
            SKIP=true
            echo "No commits since $LAST_TAG — skipping release."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (skip=$SKIP)"
      - name: Tag and create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

          # draft-release.yml keeps a draft for the next version; publish it rather than adding a second release.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --draft=false --latest
          else
            gh release create "v$VERSION" --verify-tag \
              --title "v$VERSION" \
              --generate-notes
          fi

          # A tag pushed with GITHUB_TOKEN doesn't start a workflow run, but a dispatch does: build.yml builds the tag
          # and its publish job pushes the packages to nuget.org.
          gh workflow run build.yml --ref "v$VERSION"
